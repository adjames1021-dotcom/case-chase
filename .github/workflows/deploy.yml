# Every push to main is checked, then deployed to Cloudflare Pages:
#   https://case-sim.pages.dev       the game (site/)
#   https://case-sim.pages.dev/api   its server (functions/ runs server/src/worker.js)
# If a check or test fails, nothing is deployed and the live site keeps
# running the last good version.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  needed to deploy; without it the checks still run
#   ADMIN_KEY             optional (ADMK-...); adds the gift and moderation tests

name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button: redeploys everything

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c4b9d3250d966ac6efadd0db7204459c
  PAGES_PROJECT: case-sim

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game and server files
        run: node scripts/check.mjs
      - name: Install a test browser
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Play the game in a headless browser
        run: node scripts/smoke.mjs

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a local copy of the site and its server
        run: |
          node scripts/sync-core.mjs
          npx --yes wrangler@4 d1 execute case-sim --local --file server/schema.sql
          npx --yes wrangler@4 pages dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8787/api/config >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/api/config
      - name: Test accounts, cases, trades and battles
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: node scripts/api-test.mjs
      - name: Server log
        if: failure()
        run: tail -100 wrangler.log

  deploy:
    needs: [check, server-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out what changed
        id: plan
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. See README.md."
            echo "token=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$changed"
          # The site carries the server too, so any of these redeploys it.
          echo "site=$(echo "$changed" | grep -qE '^site/|^server/|^functions/|^scripts/sync-core.mjs$|^wrangler.toml$' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "schema=$(echo "$changed" | grep -q '^server/schema.sql$' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Tables first, so new code never runs against old tables.
      - name: Update database tables
        if: steps.plan.outputs.schema == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 execute case-sim --remote --file schema.sql --yes

      - name: Deploy game
        if: steps.plan.outputs.site == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/sync-core.mjs
          npx --yes wrangler@4 pages deploy site --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Confirm the live site answers
        if: steps.plan.outputs.token == 'true'
        run: |
          sleep 8
          curl -fsS -o /dev/null -w "game: HTTP %{http_code}\n" https://case-sim.pages.dev/
          curl -fsS https://case-sim.pages.dev/api/config && echo
