# Cloudflare Pages: the game (site/) plus its server (functions/, which runs
# server/api.js). The only Cloudflare config in the repo. Deployed by the
# workflow with `wrangler pages deploy`.
name = "case-sim"
pages_build_output_dir = "site"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "case-sim"
database_id = "8bb7c3c1-5849-48f4-9f5b-35e5a8fba6a3"

[vars]
# Public half of the admin key, the same one the game carries. It lets the
# server check signed admin requests. Safe to publish; the private half never
# goes near the server.
ADMIN_X = "FlmySf715vkyc4vayPgbDNLuTV4r0ewWrdDQIN-sDfk"
ADMIN_Y = "Sx2xiZcEaH71oDjHa2bYR9eNGFJoSaUy8Is_qu_tRIE"
# Accounts that always have admin, by account id (not name, so nobody can
# inherit it by taking the name). Comma-separated. Ae1HmHq6crc1 is LILBEAN.
ADMIN_ACCOUNTS = "Ae1HmHq6crc1"
