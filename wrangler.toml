# Cloudflare Pages: the game (site/) plus its server (functions/, which runs
# server/src/worker.js). Deployed by the workflow with `wrangler pages deploy`.
# The database and admin key must match server/wrangler.toml; the checks
# make sure they do.
name = "case-sim"
pages_build_output_dir = "site"
compatibility_date = "2025-06-01"

[[d1_databases]]
